id: factory-knowledge-hub-smoke
title: Knowledge Hub smoke — wire to fast
feature: knowledge-hub
route:
  path: /factory/knowledge-hub

setup:
  session: authenticated

steps:
  - action: goto
    path: /factory/knowledge-hub
  - action: fill
    testId: knowledge-hub-query-input
    value: lockout procedure
  - action: click
    testId: knowledge-hub-submit-btn
  - action: waitFor
    testId: knowledge-hub-answer

assertions:
  ui:
    - testId: knowledge-hub-page
    - testId: knowledge-hub-answer
  semantic:
    ready: true

testIds:
  required:
    - knowledge-hub-page
    - knowledge-hub-query-input
    - knowledge-hub-submit-btn
    - knowledge-hub-answer
