id: factory-knowledge-hub
title: Knowledge Hub
status: wire
owner: portal-team
summary: Factory AI pilot — RAG query wired to fast-api-base POST /knowledge/query

codegen:
  profile: query
  entity: knowledge-hub
  module: factory

entities:
  - name: KnowledgeQuery
    fields:
      - key: query
        kind: scalar
        type: string
        scopes: [form, request]
      - key: plant_id
        kind: scalar
        type: integer
        scopes: [form, request]
        nullable: true
      - key: answer
        kind: scalar
        type: string
        scopes: [response]
      - key: citations
        kind: array
        scopes: [response]
        items:
          - key: source
            kind: scalar
            type: string
          - key: excerpt
            kind: scalar
            type: string
          - key: page
            kind: scalar
            type: integer
            nullable: true

ui:
  composition:
    pattern: query-form
  routes:
    - path: /factory/knowledge-hub
      pageTestId: knowledge-hub-page
  form:
    fields:
      - key: query
        label: SOP / manual question
        component: textarea
  testIds:
    module: knowledge-hub
    required:
      - knowledge-hub-page
      - knowledge-hub-query-input
      - knowledge-hub-submit-btn
      - knowledge-hub-answer

api:
  endpoints:
    - method: POST
      path: /knowledge/query
      action: query

tags:
  - "#wire-only: network"
